<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ಶಿಕ್ಷಕರ ದಿನಚರಿ - Teacher Diary</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#123b66;--gold:#f4d35e;--green:#16803c;--red:#b42318;--border:#333;--bg:#f3f6fa}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Kannada","Nirmala UI",Arial,sans-serif;background:var(--bg);color:#111}
header.app{background:var(--blue);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px}
header.app h1{font-size:20px;margin:0}
.wrap{max-width:1500px;margin:18px auto;padding:0 14px}
.panel{background:#fff;border-radius:10px;padding:16px;box-shadow:0 2px 12px #00000012;margin-bottom:15px}
.panel h2{margin:0 0 12px;font-size:18px;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}
input,select,button,textarea{font:inherit}
input[type=text],input[type=date],select,textarea{width:100%;padding:8px 9px;border:1px solid #b8c1cc;border-radius:6px;background:#fff}
button{border:0;border-radius:6px;padding:9px 13px;cursor:pointer;font-weight:700}
.btn{background:var(--blue);color:#fff}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.gray{background:#68717c}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.message{padding:9px 12px;border-radius:6px;margin-top:10px;display:none}
.message.ok{display:block;background:#e7f7ec;color:#12652e}.message.err{display:block;background:#fdecec;color:#8a1c1c}
.teacher-row{display:flex;gap:8px;align-items:end}.teacher-row .grow{flex:1}
.week-tools{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.week-tools .field{min-width:190px}
.day-editor{margin-top:15px;border:1px solid #cfd6de;border-radius:8px;overflow:hidden}
.day-title{background:#eaf1f8;padding:9px 12px;font-weight:800;color:var(--blue);display:flex;justify-content:space-between;align-items:center}
.entry-table{width:100%;border-collapse:collapse;table-layout:fixed}
.entry-table th,.entry-table td{border:1px solid #b8b8b8;padding:5px;vertical-align:top}
.entry-table th{background:#f4f4f4;text-align:center;font-size:12px}
.entry-table td{font-size:12px}
.entry-table .pno{width:42px;text-align:center}.entry-table .time{width:105px;text-align:center}.entry-table .used{width:115px}.entry-table .task{width:auto}.entry-table .mins{width:75px}
.custom{display:none;margin-top:4px}
.leave-banner{background:#fff0f0;border:1px solid #efb4b4;color:#9c1c1c;padding:18px;text-align:center;font-weight:800}
.total-row{background:#fff8d8;font-weight:800;text-align:right}
.small{font-size:11px;color:#666}
.leave-list table{width:100%;border-collapse:collapse}.leave-list th,.leave-list td{border:1px solid #ddd;padding:7px}.leave-list th{background:#f5f5f5}
.notice{font-size:12px;color:#555;margin-top:6px}
.hidden{display:none!important}

/* PRINT */
#printRoot{display:none}
@media print{
 @page{size:A4 landscape;margin:7mm}
 body{background:#fff}
 body>*:not(#printRoot){display:none!important}
 #printRoot{display:block}
 .print-page{width:100%;height:196mm;position:relative;page-break-after:always;overflow:hidden}
 .print-page:last-child{page-break-after:auto}
 .phead{text-align:center}
 .phead .yearline{font-weight:800;font-size:15px}
 .phead .mainhead{background:#f6df75;border:1px solid #222;font-weight:900;font-size:16px;padding:5px;margin-top:4px}
 .schoolline{font-weight:700;text-align:left;font-size:12px;margin:5px 0}
 .meta{font-size:11px;display:flex;gap:20px;margin-bottom:4px}
 .meta span{white-space:nowrap}
 .print-day{margin-bottom:3px}
 .print-day-title{font-weight:800;font-size:11px;margin:2px 0}
 .print-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:8.2px}
 .print-table th,.print-table td{border:1px solid #222;padding:2px 2px;line-height:1.1;vertical-align:middle}
 .print-table th{text-align:center;font-weight:800}
 .print-table .c1{width:3.5%}.print-table .c2{width:8%}.print-table .c3{width:9%}
 .print-table .c4{width:14%}.print-table .c5{width:5.5%}.print-table .c6{width:14%}.print-table .c7{width:5.5%}.print-table .c8{width:14%}.print-table .c9{width:5.5%}
 .print-total{text-align:right;font-weight:800;background:#fafafa}
 .weekly-title{background:#f6df75;border:1px solid #222;text-align:center;font-weight:900;padding:4px;font-size:11px;margin-top:4px}
 .weekly-table{width:100%;border-collapse:collapse;font-size:8.5px}
 .weekly-table th,.weekly-table td{border:1px solid #222;padding:3px;text-align:center}
 .signs{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:15px;font-size:10px;text-align:center}
 .signs div{padding-top:18px}
}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.entry-table{min-width:1050px}.day-editor{overflow:auto}}
</style>
</head>
<body>
<header class="app">
  <h1>📘 ಶಿಕ್ಷಕರ ದಿನಚರಿ - Teacher Diary</h1>
  <div class="actions">
    <button class="btn gray" onclick="window.location.href='dashboard.html'">Dashboard</button>
    <button class="btn green" onclick="printWeek()">🖨️ Print / PDF</button>
  </div>
</header>

<div class="wrap">
  <div class="panel">
    <h2>Teacher Diary – ವಾರದ ಮಾಹಿತಿ</h2>
    <div class="grid">
      <div class="field"><label>ವರ್ಷ</label><input id="year" type="text" maxlength="7" placeholder="ಉದಾ: 2026-27"></div>
      <div class="field"><label>ತಿಂಗಳು</label>
        <select id="monthFilter" onchange="loadSelectedMonth()">
          <option value="">ತಿಂಗಳು ಆಯ್ಕೆಮಾಡಿ</option>
          <option value="0">ಜನವರಿ</option><option value="1">ಫೆಬ್ರವರಿ</option><option value="2">ಮಾರ್ಚ್</option>
          <option value="3">ಏಪ್ರಿಲ್</option><option value="4">ಮೇ</option><option value="5">ಜೂನ್</option>
          <option value="6">ಜುಲೈ</option><option value="7">ಆಗಸ್ಟ್</option><option value="8">ಸೆಪ್ಟೆಂಬರ್</option>
          <option value="9">ಅಕ್ಟೋಬರ್</option><option value="10">ನವೆಂಬರ್</option><option value="11">ಡಿಸೆಂಬರ್</option>
        </select>
      </div>
      <div class="field"><label>ವಾರದ ಸೋಮವಾರದ ದಿನಾಂಕ</label><input id="weekStart" type="date" onchange="buildWeek()"></div>
      <div class="field"><label>ಶಿಕ್ಷಕರ ಹೆಸರು</label>
        <select id="teacherSelect"><option value="">ಶಿಕ್ಷಕರನ್ನು ಆಯ್ಕೆಮಾಡಿ</option></select>
      </div>
      <div class="field" style="display:flex;align-items:end;gap:6px">
        <button type="button" class="btn" onclick="addTeacher(event)">+ Add Teacher</button>
        <button type="button" class="btn red" onclick="deleteTeacher(event)">Delete Teacher</button>
      </div>
    </div>
    <div class="notice">ದಿನಾಂಕ ಆಯ್ಕೆ ಮಾಡಿದಾಗ ವಾರದ ದಿನ ಸ್ವಯಂಚಾಲಿತವಾಗಿ ತುಂಬುತ್ತದೆ. ತಿಂಗಳ dropdownನಲ್ಲಿ ಆಯ್ಕೆ ಮಾಡಿದ ತಿಂಗಳ ದಾಖಲೆಗಳಷ್ಟೇ ಪಟ್ಟಿಯಲ್ಲಿ/printನಲ್ಲಿ ಬಳಸಲಾಗುತ್ತದೆ.</div>
    <div id="topMsg" class="message"></div>
  </div>

  <div class="panel">
    <h2>ದಿನವಾರು Entry</h2>
    <div id="weekEditor"></div>
    <div class="actions" style="margin-top:12px">
      <button class="btn green" onclick="saveWeek()">💾 Save Week</button>
      <button class="btn gray" onclick="clearEditor()">Clear</button>
      <button class="btn" onclick="printWeek()">🖨️ Print / PDF</button>
    </div>
  </div>

  <div class="panel">
    <h2>ರಜೆ ನಿರ್ವಹಣೆ</h2>
    <div class="grid">
      <div class="field"><label>ರಜೆ ದಿನಾಂಕ</label><input id="leaveDate" type="date"></div>
      <div class="field" style="grid-column:span 3"><label>ರಜೆಯ ಕಾರಣ</label><input id="leaveReason" type="text" placeholder="ಉದಾ: ಸಾರ್ವಜನಿಕ ರಜೆ"></div>
      <div class="field" style="display:flex;align-items:end"><button class="btn" onclick="saveLeave()">ರಜೆ Save</button></div>
    </div>
    <div id="leaveList" class="leave-list" style="margin-top:12px"></div>
  </div>

  <div class="panel">
    <h2>ಆಯ್ಕೆ ಮಾಡಿದ ತಿಂಗಳ Diary</h2>
    <div id="monthList"></div>
  </div>
</div>

<div id="printRoot"></div>

<script>
const SUPABASE_URL="https://xhskrohrrsxlfbdbhyji.supabase.co";
const SUPABASE_KEY="sb_publishable_0amt5yG7ZIm6JD7oub6JTw_Hv5Nx2cl";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const DAY_NAMES=["ಭಾನುವಾರ","ಸೋಮವಾರ","ಮಂಗಳವಾರ","ಬುಧವಾರ","ಗುರುವಾರ","ಶುಕ್ರವಾರ","ಶನಿವಾರ"];
const MONTHS=["ಜನವರಿ","ಫೆಬ್ರವರಿ","ಮಾರ್ಚ್","ಏಪ್ರಿಲ್","ಮೇ","ಜೂನ್","ಜುಲೈ","ಆಗಸ್ಟ್","ಸೆಪ್ಟೆಂಬರ್","ಅಕ್ಟೋಬರ್","ನವೆಂಬರ್","ಡಿಸೆಂಬರ್"];
const periods={
  1:["10:00-10:45",45],2:["10:45-11:30",45],3:["11:40-12:25",45],4:["12:25-1:10",45],
  5:["1:55-2:40",45],6:["2:40-3:25",45],7:["3:35-4:20",45]
};
const saturdayPeriods={1:["8:40-9:20",40],2:["9:20-10:00",40],3:["10:30-11:10",40],4:["11:10-11:50",40],5:["11:50-12:30",40]};
const teaching=["8TH ಪಾಠ ಬೋಧನೆ","8TH ಘಟಕ ಪರೀಕ್ಷೆ","9TH ಪಾಠ ಬೋಧನೆ","9TH ಘಟಕ ಪರೀಕ್ಷೆ","10TH ಪಾಠ ಬೋಧನೆ","10TH ಘಟಕ ಪರೀಕ್ಷೆ"];
const otherTeaching=["ಪಾಠದ ಸಿದ್ದತೆ","ಪರೀಕ್ಷೆ ಮೌಲ್ಯಮಾಪನ","ಚಟುವಟಿಕೆ ಮೌಲ್ಯಮಾಪನ","ಗೃಹಪಾಠ ವೀಕ್ಷಣೆ"];
const nonTeaching=["ಸಿಬ್ಬಂದಿ ಸಭೆ/ಸಾಮಾನ್ಯ ಸಭೆ","ಮದ್ಯಾಹ್ನ ಭೋಜನಾ ಮೇಲ್ವಿಚಾರಣೆ","ಸ್ವಚ್ಛತಾ ಕಾರ್ಯ","ಪೋಷಕರ ಸಂಪರ್ಕ","ಆನ್ಲೈನ್‌ ಕಾರ್ಯ","ಗ್ರಂಥಾಲಯ ವ್ಯವಸ್ಥೆ","ಕ್ರೀಡೆ/ಸಾಂಸ್ಕೃತಿಕ ಸಿದ್ದತೆ","SDMC ಸಭೆ"];
let schoolId=null, editingId=null, weekData=[];

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function dayName(date){return date?DAY_NAMES[new Date(date+"T00:00:00").getDay()]: "";}
function addDays(dateStr,n){const d=new Date(dateStr+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function monthName(date){return date?MONTHS[new Date(date+"T00:00:00").getMonth()]:"";}
function showMsg(text,ok=true){const el=document.getElementById("topMsg");el.textContent=text;el.className="message "+(ok?"ok":"err");setTimeout(()=>el.className="message",3500)}

async function getSchoolId(){
  const {data,error}=await sb.rpc("get_my_school_id");
  if(error) throw error;
  if(!data) throw new Error("ಈ Login userಗೆ School mapping ಇಲ್ಲ.");
  return data;
}
async function checkLogin(){
  const {data}=await sb.auth.getSession();
  if(!data?.session){location.href="login.html";return false}
  return true;
}
async function loadSchoolName(){
  try{
    const {data}=await sb.from("school_cashbook_settings").select("school_name").eq("school_id",schoolId).maybeSingle();
    window.schoolName=data?.school_name||"";
  }catch(e){window.schoolName=""}
}

async function loadTeachers(selectId=""){
  const sel=document.getElementById("teacherSelect");
  if(!sel) return;
  sel.innerHTML='<option value="">ಶಿಕ್ಷಕರನ್ನು ಆಯ್ಕೆಮಾಡಿ</option>';

  if(!schoolId){
    showMsg("School ID ಸಿಗಲಿಲ್ಲ. Login/School mapping ಪರಿಶೀಲಿಸಿ.",false);
    return false;
  }

  const {data,error}=await sb
    .from("teacher_diary_teachers")
    .select("id,name")
    .eq("school_id",schoolId)
    .order("name",{ascending:true});

  if(error){
    console.error("loadTeachers error:",error);
    showMsg("Teacher table load ಆಗಲಿಲ್ಲ: "+(error.message||"Unknown error"),false);
    return false;
  }

  (data||[]).forEach(t=>{
    const o=document.createElement("option");
    o.value=t.id;
    o.textContent=t.name;
    sel.appendChild(o);
  });

  if(selectId) sel.value=selectId;
  return true;
}

async function ensureSchoolId(){
  if(schoolId) return schoolId;
  try{
    const {data,error}=await sb.rpc("get_my_school_id");
    if(error){
      console.error("get_my_school_id error:",error);
      throw new Error(error.message||"get_my_school_id failed");
    }
    if(!data) throw new Error("ಈ Login userಗೆ School mapping ಇಲ್ಲ.");
    schoolId=data;
    return schoolId;
  }catch(e){
    showMsg("School ID ಪಡೆಯಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ: "+e.message,false);
    return null;
  }
}

async function addTeacher(ev){
  if(ev) ev.preventDefault();

  const sid=await ensureSchoolId();
  if(!sid) return;

  const name=prompt("ಶಿಕ್ಷಕರ ಹೆಸರು ನಮೂದಿಸಿ:");
  if(name===null) return;
  const cleanName=name.trim();
  if(!cleanName){
    alert("ಶಿಕ್ಷಕರ ಹೆಸರು ನಮೂದಿಸಿ.");
    return;
  }

  // ಮೊದಲು ಅದೇ ಶಾಲೆಯಲ್ಲಿ ಈ ಹೆಸರು ಇದೆಯೇ ಎಂದು ಪರಿಶೀಲನೆ
  const {data:duplicate,error:dupError}=await sb
    .from("teacher_diary_teachers")
    .select("id,name")
    .eq("school_id",sid)
    .ilike("name",cleanName)
    .maybeSingle();

  if(dupError && dupError.code!=="PGRST116"){
    console.error("duplicate check error:",dupError);
    showMsg("Teacher ಪರಿಶೀಲನೆ ವಿಫಲ: "+(dupError.message||"Unknown error"),false);
    return;
  }

  if(duplicate){
    showMsg("ಈ ಶಿಕ್ಷಕರ ಹೆಸರು ಈಗಾಗಲೇ ಇದೆ.",false);
    document.getElementById("teacherSelect").value=duplicate.id;
    return;
  }

  const {data:inserted,error}=await sb
    .from("teacher_diary_teachers")
    .insert({school_id:sid,name:cleanName})
    .select("id,name")
    .single();

  if(error){
    console.error("addTeacher insert error:",error);
    let msg=error.message||"Teacher save failed";
    if(error.code==="42501" || /row-level security|permission denied/i.test(msg)){
      msg="Teacher add ಮಾಡಲು RLS permission ಇಲ್ಲ. teacher_diary_teachers SQL/RLS policy ಪರಿಶೀಲಿಸಿ.";
    }
    showMsg(msg,false);
    return;
  }

  await loadTeachers(inserted?.id||"");
  showMsg("ಶಿಕ್ಷಕರ ಹೆಸರು ಯಶಸ್ವಿಯಾಗಿ ಸೇರಿಸಲಾಗಿದೆ.");
}

async function deleteTeacher(ev){
  if(ev) ev.preventDefault();

  const sid=await ensureSchoolId();
  if(!sid) return;

  const sel=document.getElementById("teacherSelect"), id=sel.value;
  if(!id){alert("ಮೊದಲು ಶಿಕ್ಷಕರನ್ನು ಆಯ್ಕೆಮಾಡಿ.");return}

  const name=sel.options[sel.selectedIndex]?.text||"";
  if(!confirm(`"${name}" ಅವರನ್ನು ಅಳಿಸಬೇಕೇ?`)) return;

  const {error}=await sb
    .from("teacher_diary_teachers")
    .delete()
    .eq("id",id)
    .eq("school_id",sid);

  if(error){
    console.error("deleteTeacher error:",error);
    showMsg(error.message||"Teacher delete failed",false);
    return;
  }

  await loadTeachers();
  showMsg("ಶಿಕ್ಷಕರ ಹೆಸರು ಅಳಿಸಲಾಗಿದೆ.");
}

function taskSelect(type,value="",custom=""){
  const arr=type==="teaching"?teaching:type==="other"?otherTeaching:nonTeaching;
  const id="t_"+Math.random().toString(36).slice(2);
  const customVal=value==="__custom__"?custom:"";
  let html=`<select class="task-select" onchange="toggleCustom(this)" data-custom="${esc(customVal)}"><option value="">ಖಾಲಿ</option>`;
  arr.forEach(x=>html+=`<option value="${esc(x)}" ${value===x?"selected":""}>${esc(x)}</option>`);
  html+=`<option value="__custom__" ${value==="__custom__"?"selected":""}>ಇತರೆ / ಸ್ವಂತವಾಗಿ ಬರೆಯಿರಿ</option></select>`;
  html+=`<input class="custom" type="text" value="${esc(customVal)}" placeholder="ಸ್ವಂತವಾಗಿ ಬರೆಯಿರಿ" ${value==="__custom__"?"style='display:block'":""}>`;
  return html;
}
function timeSelect(value="",custom=""){
  return `<select class="time-select" onchange="toggleTimeCustom(this)"><option value="">ಖಾಲಿ</option><option value="45" ${value==="45"?"selected":""}>45ನಿ</option><option value="40" ${value==="40"?"selected":""}>40ನಿ</option><option value="custom" ${value==="custom"?"selected":""}>ಸ್ವಂತವಾಗಿ ಬರೆಯಿರಿ</option></select><input class="custom time-custom" type="text" value="${esc(custom)}" placeholder="ಉದಾ: 35ನಿ" ${value==="custom"?"style='display:block'":""}>`;
}
function toggleCustom(sel){const inp=sel.parentElement.querySelector(".custom");inp.style.display=sel.value==="__custom__"?"block":"none";}
function toggleTimeCustom(sel){const inp=sel.parentElement.querySelector(".time-custom");inp.style.display=sel.value==="custom"?"block":"none";}

function buildWeek(){
  const start=document.getElementById("weekStart").value;
  if(!start){document.getElementById("weekEditor").innerHTML="";return}
  const d=new Date(start+"T00:00:00");
  const monday=new Date(d); monday.setDate(d.getDate()-((d.getDay()+6)%7));
  const mondayStr=monday.toISOString().slice(0,10);
  document.getElementById("weekStart").value=mondayStr;
  weekData=Array.from({length:6},(_,i)=>({date:addDays(mondayStr,i),leave:false,rows:[]}));
  renderWeekEditor();
}
function renderWeekEditor(){
  const box=document.getElementById("weekEditor"); box.innerHTML="";
  weekData.forEach((day,di)=>{
    const isSat=di===5, ps=isSat?saturdayPeriods:periods;
    let html=`<div class="day-editor" data-day="${di}">
      <div class="day-title"><span>${DAY_NAMES[new Date(day.date+"T00:00:00").getDay()]} — ${day.date}</span><span>${monthName(day.date)}</span></div>`;
    if(day.leave){
      html+=`<div class="leave-banner">ರಜೆ — ${esc(day.leaveReason||"")}</div></div>`;
      box.insertAdjacentHTML("beforeend",html);return;
    }
    html+=`<table class="entry-table"><thead><tr>
      <th class="pno">ಅವಧಿ</th><th class="time">ಸಮಯ</th><th class="used">ತರಗತಿ ಬೋಧನೆಗೆ ಬಳಸಿದ/ಇಲ್ಲ</th>
      <th class="task">1. ಬೋಧನ ಕಾರ್ಯ<br><span class="small">ನಿರ್ವಹಿಸಿದ ಕಾರ್ಯ</span></th><th class="mins">ಬಳಸಿದ ಸಮಯ</th>
      <th class="task">2. ಇತರೆ ಬೋಧನ ಕಾರ್ಯ<br><span class="small">ನಿರ್ವಹಿಸಿದ ಕಾರ್ಯ</span></th><th class="mins">ಬಳಸಿದ ಸಮಯ</th>
      <th class="task">3. ಬೋಧನೇತರ ಕಾರ್ಯ<br><span class="small">ನಿರ್ವಹಿಸಿದ ಕಾರ್ಯ</span></th><th class="mins">ಬಳಸಿದ ಸಮಯ</th>
    </tr></thead><tbody>`;
    for(const [p,[tm]] of Object.entries(ps)){
      const r=day.rows.find(x=>x.period==p)||{};
      html+=`<tr data-period="${p}">
        <td class="pno">${p}</td><td class="time">${tm}</td>
        <td class="used"><select class="used-select"><option value=""></option><option value="ಬಳಸಿದೆ" ${r.used==="ಬಳಸಿದೆ"?"selected":""}>ಬಳಸಿದೆ</option><option value="ಇಲ್ಲ" ${r.used==="ಇಲ್ಲ"?"selected":""}>ಇಲ್ಲ</option></select></td>
        <td>${taskSelect("teaching",r.t1,r.t1custom)}</td><td>${timeSelect(r.t1min,r.t1minCustom)}</td>
        <td>${taskSelect("other",r.t2,r.t2custom)}</td><td>${timeSelect(r.t2min,r.t2minCustom)}</td>
        <td>${taskSelect("non",r.t3,r.t3custom)}</td><td>${timeSelect(r.t3min,r.t3minCustom)}</td>
      </tr>`;
    }
    html+=`</tbody><tfoot><tr><td colspan="9" class="total-row">ಒಟ್ಟು (ಘಂಟೆ ನಿಮಿಷಗಳಲ್ಲಿ): <span class="day-total">0ನಿ</span></td></tr></tfoot></table></div>`;
    box.insertAdjacentHTML("beforeend",html);
  });
  refreshTotals();
}

function readEditor(){
  const days=[];
  document.querySelectorAll(".day-editor").forEach((el,di)=>{
    const base=weekData[di];
    const day={date:base.date,leave:base.leave,leaveReason:base.leaveReason||"",rows:[]};
    if(!day.leave){
      el.querySelectorAll("tbody tr").forEach(tr=>{
        const cells=tr.children;
        const taskVals=[cells[3],cells[5],cells[7]].map(td=>{
          const s=td.querySelector(".task-select"), c=td.querySelector(".custom");
          return {v:s.value, c:c?.value||""};
        });
        const timeVals=[cells[4],cells[6],cells[8]].map(td=>{
          const s=td.querySelector(".time-select"), c=td.querySelector(".time-custom");
          return {v:s.value,c:c?.value||""};
        });
        day.rows.push({period:tr.dataset.period,used:cells[2].querySelector("select").value,
          t1:taskVals[0].v,t1custom:taskVals[0].c,t1min:timeVals[0].v,t1minCustom:timeVals[0].c,
          t2:taskVals[1].v,t2custom:taskVals[1].c,t2min:timeVals[1].v,t2minCustom:timeVals[1].c,
          t3:taskVals[2].v,t3custom:taskVals[2].c,t3min:timeVals[2].v,t3minCustom:timeVals[2].c});
      });
    }
    days.push(day);
  });
  return days;
}
function parseMin(v,custom){
  if(v==="45"||v==="40")return Number(v);
  if(v==="custom"){const m=String(custom||"").match(/\d+/);return m?Number(m[0]):0}
  return 0;
}
function dayTotal(day){return (day.rows||[]).reduce((s,r)=>s+parseMin(r.t1min,r.t1minCustom)+parseMin(r.t2min,r.t2minCustom)+parseMin(r.t3min,r.t3minCustom),0)}
function hm(min){return `${Math.floor(min/60)} ಗಂಟೆ ${min%60} ನಿಮಿಷ`}
function refreshTotals(){
  const days=readEditor();
  document.querySelectorAll(".day-editor").forEach((el,i)=>{const x=el.querySelector(".day-total");if(x)x.textContent=hm(dayTotal(days[i]))});
}
document.addEventListener("change",e=>{if(e.target.closest(".entry-table"))refreshTotals()});

async function saveWeek(){
  const teacherId=document.getElementById("teacherSelect").value, year=document.getElementById("year").value.trim();
  if(!year){alert("ವರ್ಷ ನಮೂದಿಸಿ.");return}
  if(!teacherId){alert("ಶಿಕ್ಷಕರನ್ನು ಆಯ್ಕೆಮಾಡಿ.");return}
  const days=readEditor();
  const payload={school_id:schoolId,teacher_id:teacherId,academic_year:year,week_start:days[0].date,month_no:new Date(days[0].date+"T00:00:00").getMonth()+1,data:days,updated_at:new Date().toISOString()};
  const {data:existing}=await sb.from("teacher_diary_weeks").select("id").eq("school_id",schoolId).eq("teacher_id",teacherId).eq("academic_year",year).eq("week_start",days[0].date).maybeSingle();
  let error;
  if(existing) ({error}=await sb.from("teacher_diary_weeks").update(payload).eq("id",existing.id));
  else ({error}=await sb.from("teacher_diary_weeks").insert(payload));
  if(error){showMsg(error.message,false);return}
  showMsg("ವಾರದ Teacher Diary ಯಶಸ್ವಿಯಾಗಿ Save ಆಗಿದೆ.");
  await loadSelectedMonth();
}
async function loadWeek(week){
  const teacherId=document.getElementById("teacherSelect").value;
  const year=document.getElementById("year").value.trim();
  if(!teacherId||!year)return;
  const {data,error}=await sb.from("teacher_diary_weeks").select("*").eq("school_id",schoolId).eq("teacher_id",teacherId).eq("academic_year",year).eq("week_start",week).maybeSingle();
  if(error){showMsg(error.message,false);return}
  document.getElementById("weekStart").value=week;
  if(data?.data){weekData=data.data;renderWeekEditor()}else buildWeek();
}
async function loadSelectedMonth(){
  const m=document.getElementById("monthFilter").value, teacherId=document.getElementById("teacherSelect").value, year=document.getElementById("year").value.trim();
  if(!m||!teacherId||!year){document.getElementById("monthList").innerHTML="";return}
  const start=`${year.slice(0,4)}-${String(Number(m)+1).padStart(2,"0")}-01`;
  const endDate=new Date(Number(year.slice(0,4)),Number(m)+1,0);
  const end=endDate.toISOString().slice(0,10);
  const {data,error}=await sb.from("teacher_diary_weeks").select("id,week_start,updated_at").eq("school_id",schoolId).eq("teacher_id",teacherId).eq("academic_year",year).gte("week_start",start).lte("week_start",end).order("week_start");
  if(error){document.getElementById("monthList").innerHTML='<div class="notice">Database table setup ಬೇಕಾಗಿದೆ.</div>';return}
  document.getElementById("monthList").innerHTML=(data||[]).length?`<table class="leave-list"><tr><th>ವಾರ</th><th>ದಿನಾಂಕ</th><th>Action</th></tr>${data.map(x=>`<tr><td>ವಾರ</td><td>${x.week_start}</td><td><button class="btn" onclick="loadWeek('${x.week_start}')">Open / Edit</button><button class="btn red" onclick="deleteWeek('${x.id}')">Delete</button></td></tr>`).join("")}</table>`:"ಈ ತಿಂಗಳಿಗೆ ದಾಖಲೆ ಇಲ್ಲ.";
}
async function deleteWeek(id){if(!confirm("ಈ ವಾರದ Diary ಅಳಿಸಬೇಕೇ?"))return;const {error}=await sb.from("teacher_diary_weeks").delete().eq("id",id).eq("school_id",schoolId);if(error)showMsg(error.message,false);else{showMsg("ವಾರದ Diary ಅಳಿಸಲಾಗಿದೆ.");loadSelectedMonth()}}

async function saveLeave(){
  const date=document.getElementById("leaveDate").value, reason=document.getElementById("leaveReason").value.trim(), teacherId=document.getElementById("teacherSelect").value, year=document.getElementById("year").value.trim();
  if(!date||!reason||!teacherId||!year){alert("ವರ್ಷ, ಶಿಕ್ಷಕ, ದಿನಾಂಕ ಮತ್ತು ರಜೆಯ ಕಾರಣ ನಮೂದಿಸಿ.");return}
  const {error}=await sb.from("teacher_diary_leaves").upsert({school_id:schoolId,teacher_id:teacherId,academic_year:year,leave_date:date,reason},{onConflict:"school_id,teacher_id,leave_date"});
  if(error){showMsg(error.message,false);return}
  showMsg("ರಜೆ Save ಆಗಿದೆ.");document.getElementById("leaveDate").value="";document.getElementById("leaveReason").value="";await loadLeaves();await applyLeavesToCurrentWeek();
}
async function loadLeaves(){
  const teacherId=document.getElementById("teacherSelect").value, year=document.getElementById("year").value.trim();
  if(!teacherId||!year){document.getElementById("leaveList").innerHTML="";return}
  const {data,error}=await sb.from("teacher_diary_leaves").select("*").eq("school_id",schoolId).eq("teacher_id",teacherId).eq("academic_year",year).order("leave_date");
  if(error){document.getElementById("leaveList").innerHTML="";return}
  window.leaves=data||[];
  document.getElementById("leaveList").innerHTML=window.leaves.length?`<table><tr><th>ದಿನಾಂಕ</th><th>ವಾರ</th><th>ರಜೆಯ ಕಾರಣ</th><th>Action</th></tr>${window.leaves.map(x=>`<tr><td>${x.leave_date}</td><td>${dayName(x.leave_date)}</td><td>${esc(x.reason)}</td><td><button class="btn" onclick="editLeave('${x.id}')">Edit</button> <button class="btn red" onclick="deleteLeave('${x.id}')">Delete</button></td></tr>`).join("")}</table>`:"ಯಾವುದೇ ರಜೆ ದಾಖಲೆ ಇಲ್ಲ.";
}
async function editLeave(id){
  const x=window.leaves.find(a=>a.id===id);if(!x)return;
  const reason=prompt("ರಜೆಯ ಕಾರಣ ಬದಲಿಸಿ",x.reason);if(reason===null)return;
  const date=prompt("ದಿನಾಂಕ (YYYY-MM-DD)",x.leave_date);if(date===null)return;
  const {error}=await sb.from("teacher_diary_leaves").update({leave_date:date,reason:reason.trim()}).eq("id",id).eq("school_id",schoolId);
  if(error)showMsg(error.message,false);else{showMsg("ರಜೆ Update ಆಗಿದೆ.");await loadLeaves();await applyLeavesToCurrentWeek()}
}
async function deleteLeave(id){if(!confirm("ಈ ರಜೆ ದಾಖಲೆಯನ್ನು ಅಳಿಸಬೇಕೇ?"))return;const {error}=await sb.from("teacher_diary_leaves").delete().eq("id",id).eq("school_id",schoolId);if(error)showMsg(error.message,false);else{showMsg("ರಜೆ ಅಳಿಸಲಾಗಿದೆ.");await loadLeaves();await applyLeavesToCurrentWeek()}}
async function applyLeavesToCurrentWeek(){
  if(!weekData.length)return;
  const leaveMap=new Map((window.leaves||[]).map(x=>[x.leave_date,x.reason]));
  weekData.forEach(d=>{if(leaveMap.has(d.date)){d.leave=true;d.leaveReason=leaveMap.get(d.date)}else{d.leave=false;d.leaveReason=""}});
  renderWeekEditor();
}

async function makePrintData(){
  const teacherSel=document.getElementById("teacherSelect"), teacher=teacherSel.options[teacherSel.selectedIndex]?.text||"";
  const year=document.getElementById("year").value.trim(), days=readEditor();
  return {teacher,year,days,school:window.schoolName||"ಶ್ರೇ ವೀರಬಲ್ಲಾಳ ಗ್ರಾಮಾಂತರ ಪ್ರೌಢಶಾಲೆ ಬಲ್ಲಾಳಸಮುದ್ರ ಹೊಸದುರ್ಗ ತಾ||"};
}
function taskText(v,c){return v==="__custom__"?c:(v||"")}
function timeText(v,c){if(v==="45")return"45ನಿ";if(v==="40")return"40ನಿ";if(v==="custom")return c||"";return""}
function printDayTable(day,di){
  const sat=di===5, ps=sat?saturdayPeriods:periods;
  let rows="";
  if(day.leave){
    rows=`<tr><td colspan="9" style="height:25mm;text-align:center;font-weight:900;font-size:12px">ರಜೆ — ${esc(day.leaveReason||"")}</td></tr>`;
  }else{
    for(const [p,[tm]] of Object.entries(ps)){
      const r=day.rows.find(x=>x.period==p)||{};
      rows+=`<tr><td>${p}</td><td>${tm}</td><td>${esc(r.used||"")}</td><td>${esc(taskText(r.t1,r.t1custom))}</td><td>${esc(timeText(r.t1min,r.t1minCustom))}</td><td>${esc(taskText(r.t2,r.t2custom))}</td><td>${esc(timeText(r.t2min,r.t2minCustom))}</td><td>${esc(taskText(r.t3,r.t3custom))}</td><td>${esc(timeText(r.t3min,r.t3minCustom))}</td></tr>`;
    }
    rows+=`<tr><td colspan="9" class="print-total">ಒಟ್ಟು (ಘಂಟೆ ನಿಮಿಷಗಳಲ್ಲಿ): ${hm(dayTotal(day))}</td></tr>`;
  }
  return `<div class="print-day"><div class="print-day-title">ತಿಂಗಳು: ${esc(monthName(day.date))} &nbsp;&nbsp; ದಿನಾಂಕ: ${esc(day.date)} &nbsp;&nbsp; ವಾರ: ${esc(dayName(day.date))}</div>
  <table class="print-table"><thead><tr><th rowspan="2" class="c1">ಅವಧಿ</th><th rowspan="2" class="c2">ಸಮಯ</th><th rowspan="2" class="c3">ತರಗತಿ ಬೋಧನೆಗೆ<br>ಬಳಸಿದ/ಇಲ್ಲ</th><th colspan="2">1. ಬೋಧನ ಕಾರ್ಯ</th><th colspan="2">2. ಇತರೆ ಬೋಧನ ಕಾರ್ಯ</th><th colspan="2">3. ಬೋಧನೇತರ ಕಾರ್ಯ</th></tr>
  <tr><th class="c4">ನಿರ್ವಹಿಸಿದ ಕಾರ್ಯ</th><th class="c5">ಬಳಸಿದ ಸಮಯ</th><th class="c6">ನಿರ್ವಹಿಸಿದ ಕಾರ್ಯ</th><th class="c7">ಬಳಸಿದ ಸಮಯ</th><th class="c8">ನಿರ್ವಹಿಸಿದ ಕಾರ್ಯ</th><th class="c9">ಬಳಸಿದ ಸಮಯ</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function weeklySummary(days){
  const data=days.map(d=>({name:dayName(d.date),total:dayTotal(d)}));
  const total=data.reduce((s,x)=>s+x.total,0);
  return `<div class="weekly-title">ವಾರದಲ್ಲಿ ಬಳಸಿದ ಸಮಯದ ಕ್ರೋಢೀಕೃತ ಪಟ್ಟಿ (ದಿನಾಂಕ: ${esc(days[0]?.date||"")} ರಿಂದ ದಿನಾಂಕ: ${esc(days[5]?.date||" ರವರೆಗೆ)})</div>
  <table class="weekly-table"><tr><th>ಅವಧಿ</th><th>ವಾರ</th><th>ತರಗತ<br>ಬೋಧನೆಗೆ ಬಳಸಿದ/ಇಲ್ಲ</th><th>ಚಟುವಟಿಕೆವಾರು ಬಳಸಿಕೊಂಡ ಒಟ್ಟು ಸಮಯ (ಘಂಟೆ/ನಿಮಿಷಗಳಲ್ಲಿ)</th></tr>
  ${data.map((x,i)=>`<tr><td>${i+1}</td><td>${x.name}</td><td>${days[i].leave?"ರಜೆ":""}</td><td>${hm(x.total)}</td></tr>`).join("")}
  <tr><th colspan="3">ಒಟ್ಟು</th><th>${hm(total)}</th></tr></table>`;
}
async function printWeek(){
  const d=await makePrintData();
  if(!d.days.length){alert("ಮೊದಲು ವಾರದ ದಿನಾಂಕಗಳನ್ನು ಆಯ್ಕೆಮಾಡಿ.");return}
  const page1=d.days.slice(0,3).map((x,i)=>printDayTable(x,i)).join("");
  const page2=d.days.slice(3).map((x,i)=>printDayTable(x,i+3)).join("");
  document.getElementById("printRoot").innerHTML=`
  <section class="print-page"><div class="phead">
  <div class="yearline">${esc(d.year)}ನೇ ಸಾಲಿನಲ್ಲಿ ಶಿಕ್ಷಕರು ಶಾಲೆಗಳಲ್ಲಿ ವೇಳಾಪಟ್ಟಿಯನುಸಾರ ಬಳಸಿಕೊಂಡ ಸಮಯ ನಿರ್ವಹಣೆ ವಿವರ</div>
  <div class="mainhead">ಶಿಕ್ಷಕರ ದಿನಚರಿ - ದೈನಂದಿನ ಕಾರ್ಯನಿರ್ವಹಣಾ ವಿವರ/ಪಟ್ಟಿ (Teacher's Daily Time-Used Report)</div>
  <div class="schoolline">ಶಾಲೆಯ ಹೆಸರು: ${esc(d.school)} &nbsp;&nbsp;&nbsp; ಶಿಕ್ಷಕರ ಹೆಸರು: ${esc(d.teacher)}</div></div>${page1}</section>
  <section class="print-page">${page2}${weeklySummary(d.days)}<div class="signs"><div>ಶಿಕ್ಷಕರ ಸಹಿ :</div><div>ವೀಕ್ಷಣಾಧಿಕಾರರ ಸಹಿ :</div><div>ಮುಖ್ಯ ಶಿಕ್ಷಕರ ಸಹಿ :</div></div></section>`;
  window.print();
}

async function clearEditor(){if(confirm("ಈ ವಾರದ entry screen clear ಮಾಡಬೇಕೇ?")){buildWeek()}}
async function init(){
  try{
    if(!(await checkLogin()))return;
    schoolId=await ensureSchoolId();
    if(!schoolId)return;
    await loadSchoolName();
    await loadTeachers();
    document.getElementById("teacherSelect").addEventListener("change",async()=>{await loadLeaves();await loadSelectedMonth()});
    document.getElementById("year").addEventListener("change",async()=>{await loadLeaves();await loadSelectedMonth()});
    const now=new Date(), monday=new Date(now);
    monday.setDate(now.getDate()-((now.getDay()+6)%7));
    document.getElementById("weekStart").value=monday.toISOString().slice(0,10);
    buildWeek();
  }catch(e){
    console.error("Teacher Diary init error:",e);
    showMsg("Teacher Diary load error: "+(e.message||e),false);
  }
}
init();
</script>
