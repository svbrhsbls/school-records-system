let currentSchoolId = null;

const monthNames = [

function esc(v){
    return String(v ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function money(n){
    return "₹" + Number(n || 0).toLocaleString("en-IN",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    });
}

function num(n){
    return Number(n || 0);
}

function dateText(s){
    if(!s) return "";
    const p = String(s).split("-");
    if(p.length !== 3) return s;
    return `${p[2]}-${p[1]}-${p[0]}`;
}

async function loadSchool(){
    const {data,error} = await db
        .from("school_users")
        .select("school_id,user_id")
        .eq("user_id",(await db.auth.getUser()).data.user.id)
        .eq("is_active",true)
        .maybeSingle();

    if(error) throw error;
    if(!data) throw new Error("ಈ Login userಗೆ School mapping ಇಲ್ಲ.");

    currentSchoolId = data.school_id;
}

    const {data,error} = await db
        .from("school_cashbook_settings")
        .select("department_name,school_name")
        .eq("school_id",currentSchoolId)

    if(error) throw error;

    document.getElementById("departmentName").textContent =

async function loadOpening(){

    const {data,error} = await db
        .from("school_cashbook_opening_balances")
        .select("item_id,opening_balance")
        .eq("school_id",currentSchoolId)
        .eq("academic_year_id",selectedYearId)
        .eq("cashbook_type",cashbookType);

    if(error) throw error;

async function loadEntries(){
    const {data,error} = await db
        .from("school_cashbook_entries")
        .select("id,entry_type,entry_date,item_id,amount,details,created_at")
        .eq("school_id",currentSchoolId)
        .eq("academic_year_id",selectedYearId)
        .eq("cashbook_type",cashbookType)
        .order("entry_date",{ascending:true})
        .order("created_at",{ascending:true});

    if(error) throw error;

    entries = data || [];
}

function buildDailyFlow(){
    const byDate = {};

    entries.forEach(e => {
        if(!byDate[e.entry_date]) byDate[e.entry_date] = [];
        byDate[e.entry_date].push(e);
    });

    const dates = Object.keys(byDate).sort();

    let running = {};
    items.forEach(i => {
        running[i.id] = num(openingBalance[i.id]);
    });

    const rows = [];

    dates.forEach(date => {
        const dayEntries = byDate[date].slice().sort((a,b) => {
            const aa = a.created_at || "";
            const bb = b.created_at || "";
            return aa.localeCompare(bb);
        });

        const firstType =
            dayEntries[0]?.entry_type || "jama";

        const jamaTotals = {};
        const kharchuTotals = {};

        items.forEach(i => {
            jamaTotals[i.id] = 0;
            kharchuTotals[i.id] = 0;
        });

        dayEntries.forEach(e => {
            if(e.entry_type === "jama")
                jamaTotals[e.item_id] += num(e.amount);
            if(e.entry_type === "kharchu")
                kharchuTotals[e.item_id] += num(e.amount);
        });

        const hasJama = dayEntries.some(e => e.entry_type === "jama");
        const hasKharchu = dayEntries.some(e => e.entry_type === "kharchu");

        let firstMap = {...running};
        let afterFirst = {...running};

        if(firstType === "jama"){
            items.forEach(i => {
                afterFirst[i.id] =
                    firstMap[i.id] + jamaTotals[i.id];
            });

            rows.push({
                date,
                firstType:"jama",
                opening:{...firstMap},
                amount:{...jamaTotals},
                closing:{...afterFirst},
                label:"ಜಮಾ",
                details:dayEntries.filter(e => e.entry_type==="jama")
            });

            if(hasKharchu){
                const khOpening = {...afterFirst};
                const khClosing = {};

                items.forEach(i => {
                    khClosing[i.id] =
                        khOpening[i.id] - kharchuTotals[i.id];
                });

                rows.push({
                    date,
                    firstType:"jama",
                    opening:khOpening,
                    amount:{...kharchuTotals},
                    closing:{...khClosing},
                    label:"ಖರ್ಚು",
                    details:dayEntries.filter(e => e.entry_type==="kharchu")
                });

                running = khClosing;
            }else{
                running = afterFirst;
            }
        }else{
            items.forEach(i => {
                afterFirst[i.id] =
                    firstMap[i.id] - kharchuTotals[i.id];
            });

            rows.push({
                date,
                firstType:"kharchu",
                opening:{...firstMap},
                amount:{...kharchuTotals},
                closing:{...afterFirst},
                label:"ಖರ್ಚು",
                details:dayEntries.filter(e => e.entry_type==="kharchu")
            });

            if(hasJama){
                const jamaOpening = {...afterFirst};
                const jamaClosing = {};

                items.forEach(i => {
                    jamaClosing[i.id] =
                        jamaOpening[i.id] + jamaTotals[i.id];
                });

                rows.push({
                    date,
                    firstType:"kharchu",
                    opening:jamaOpening,
                    amount:{...jamaTotals},
                    closing:{...jamaClosing},
                    label:"ಜಮಾ",
                    details:dayEntries.filter(e => e.entry_type==="jama")
                });

                running = jamaClosing;
            }else{
                running = afterFirst;
            }
        }
    });

    return rows;
}


function academicMonths(){
    const y = academicYears.find(x => x.id === selectedYearId);
    if(!y) return [];

    const start = new Date(y.start_date + "T00:00:00");
    const end = new Date(y.end_date + "T00:00:00");
    const out = [];

    let d = new Date(start.getFullYear(), start.getMonth(), 1);

    while(d <= end){
        const yy = d.getFullYear();
        const mm = d.getMonth() + 1;
        const from = `${yy}-${String(mm).padStart(2,"0")}-01`;
        const lastDay = new Date(yy, mm, 0).getDate();
        const to = `${yy}-${String(mm).padStart(2,"0")}-${String(lastDay).padStart(2,"0")}`;

        out.push({
            key: `${yy}-${String(mm).padStart(2,"0")}`,
            label: `${monthNames[d.getMonth()]}-${yy}`,
            from,
            to
        });

        d = new Date(d.getFullYear(), d.getMonth()+1, 1);
    }
    return out;
}

function buildMonthlyReport(){
    const months = academicMonths();
    const monthly = months.map(m => ({
        ...m,
        opening:{},
        jama:{},
        jamaClosing:{},
        kharchu:{},
        kharchuOpening:{},
        kharchuClosing:{}
    }));

    items.forEach(i => {
        let balance = num(openingBalance[i.id]);

        monthly.forEach(m => {
            m.opening[i.id] = balance;
            m.jama[i.id] = 0;
            m.kharchu[i.id] = 0;
            m.jamaClosing[i.id] = balance;
            m.kharchuOpening[i.id] = balance;
            m.kharchuClosing[i.id] = balance;
        });
    });

    // Process entries in exact date/created order so first-entry flow is preserved.
    const ordered = entries.slice().sort((a,b) => {
        const d = String(a.entry_date).localeCompare(String(b.entry_date));
        if(d !== 0) return d;
        return String(a.created_at || "").localeCompare(String(b.created_at || ""));
    });

    const monthIndex = {};
    monthly.forEach((m,i) => monthIndex[m.key] = i);

    // Current running balance is per item. For each month we retain
    // the balance after JAMA and after KHARCHU separately.
    const running = {};
    items.forEach(i => running[i.id] = num(openingBalance[i.id]));

    ordered.forEach(e => {
        const key = String(e.entry_date).slice(0,7);
        const mi = monthIndex[key];
        if(mi === undefined) return;

        const amount = num(e.amount);
        const id = e.item_id;

        if(e.entry_type === "jama"){
            monthly[mi].jama[id] += amount;
            running[id] += amount;
        }else if(e.entry_type === "kharchu"){
            monthly[mi].kharchu[id] += amount;
            running[id] -= amount;
        }

        // Rebuild the affected month's closing values from the ordered flow.
        monthly[mi].jamaClosing[id] = running[id];
        monthly[mi].kharchuClosing[id] = running[id];
    });

    // Recalculate month-by-month openings/closings correctly from all entries.
    items.forEach(item => {
        let balance = num(openingBalance[item.id]);

        monthly.forEach(m => {
            m.opening[item.id] = balance;

            const monthEntries = ordered.filter(e =>
                String(e.entry_date).slice(0,7) === m.key &&
                e.item_id === item.id
            );

            let jamaSeen = false;
            let kharchuSeen = false;
            let afterJama = balance;
            let afterKharchu = balance;

            monthEntries.forEach(e => {
                const amount = num(e.amount);

                if(e.entry_type === "jama"){
                    m.jama[item.id] += 0; // already aggregated above
                    balance += amount;
                    afterJama = balance;
                    jamaSeen = true;
                }else{
                    balance -= amount;
                    afterKharchu = balance;
                    kharchuSeen = true;
                }
            });

            // If there was no JAMA in the month, JAMA closing remains the
            // balance entering the month; if there was JAMA, it is the
            // balance immediately after the last JAMA transaction.
            if(jamaSeen){
                m.jamaClosing[item.id] = afterJama;
            }else{
                m.jamaClosing[item.id] = m.opening[item.id];
            }

            // KHARCHU opening is the balance immediately before the first
            // KHARCHU transaction. If there is no KHARCHU, it is the balance
            // after the month's JAMA flow.
            let temp = m.opening[item.id];
            let firstKharchuOpening = null;
            monthEntries.forEach(e => {
                const amount = num(e.amount);
                if(e.entry_type === "kharchu"){
                    if(firstKharchuOpening === null) firstKharchuOpening = temp;
                    temp -= amount;
                }else{
                    temp += amount;
                }
            });

            m.kharchuOpening[item.id] =
                firstKharchuOpening === null
                    ? temp
                    : firstKharchuOpening;

            m.kharchuClosing[item.id] = balance;
        });
    });

    return monthly;
}

function tableHeader(){
    return `
        <tr>
            <th>ತಿಂಗಳು</th>
            <th>O.B</th>
            ${items.map(i => `<th>${esc(i.item_name)}</th>`).join("")}
            <th>ಒಟ್ಟು</th>
        </tr>
    `;
}

function sumMap(map){
    return items.reduce((s,i) => s + num(map[i.id]), 0);
}

function renderSeparateTable(bodyId, headId, months, kind){
    document.getElementById(headId).innerHTML = tableHeader();
    const body = document.getElementById(bodyId);

    if(!months.length){
        body.innerHTML = `<tr><td colspan="${items.length+3}" class="empty">Data ಇಲ್ಲ.</td></tr>`;
        return;
    }

    const rows = [];
    let totalByItem = {};
    items.forEach(i => totalByItem[i.id] = 0);

    months.forEach((m,idx) => {
        const isJama = kind === "jama";
        const amountMap = isJama ? m.jama : m.kharchu;
        const openingMap = isJama ? m.opening : m.kharchuOpening;
        const closingMap = isJama ? m.jamaClosing : m.kharchuClosing;

        items.forEach(i => {
            totalByItem[i.id] += num(amountMap[i.id]);
        });

        rows.push(`
            <tr>
                <td><b>${esc(m.label)}</b></td>
                <td class="money">${money(sumMap(openingMap))}</td>
                ${items.map(i => `<td class="money">${money(amountMap[i.id])}</td>`).join("")}
                <td class="money"><b>${money(sumMap(amountMap))}</b></td>
            </tr>
        `);

        rows.push(`
            <tr class="total-row">
                <td></td>
                <td class="left"><b>${isJama ? "JAMA Closing" : "KHARCHU Closing"}</b></td>
                ${items.map(i => `<td class="money">${money(closingMap[i.id])}</td>`).join("")}
                <td class="money"><b>${money(sumMap(closingMap))}</b></td>
            </tr>
        `);
    });

    const first = months[0];
    const last = months[months.length-1];

    rows.push(`
        <tr class="total-row">
            <td><b>TOTAL</b></td>
            <td class="money"><b>${money(sumMap(first.opening))}</b></td>
            ${items.map(i => `<td class="money"><b>${money(totalByItem[i.id])}</b></td>`).join("")}
            <td class="money"><b>${money(Object.values(totalByItem).reduce((a,b)=>a+b,0))}</b></td>
        </tr>
    `);

    const grandAmount = Object.values(totalByItem).reduce((a,b)=>a+b,0);
    const grandOpening = sumMap(first.opening);
    const grandClosingMap = kind === "jama" ? last.jamaClosing : last.kharchuClosing;

    rows.push(`
        <tr class="grand-row">
            <td><b>GRAND TOTAL</b></td>
            <td class="money"><b>${money(grandOpening)}</b></td>
            ${items.map(i => `<td class="money"><b>${money(grandClosingMap[i.id])}</b></td>`).join("")}
            <td class="money"><b>${money(sumMap(grandClosingMap))}</b></td>
        </tr>
    `);

    body.innerHTML = rows.join("");
}

function renderReport(){
    const months = buildMonthlyReport();
    lastReport = months;

    document.getElementById("typeTitle").textContent = cashbookType;
    document.getElementById("reportYear").textContent = selectedYear || "-";

    renderSeparateTable("jamaBody","jamaHead",months,"jama");
    renderSeparateTable("kharchuBody","kharchuHead",months,"kharchu");
}

async function generateReport(){
    try{
        document.getElementById("status").textContent = "Report loading...";

        await loadItems();
        await loadOpening();
        await loadEntries();

        updateHeader();
        renderReport();

        document.getElementById("status").textContent =
            "ಎಲ್ಲಾ ತಿಂಗಳ Report ಸಿದ್ಧವಾಗಿದೆ.";
    }catch(error){
        console.error(error);
        document.getElementById("status").textContent =
            "Report failed: " + error.message;
        alert("Report failed: " + error.message);
    }
}

function exportExcel(){
    try{
        if(!lastReport) {
            alert("ಮೊದಲು Report load ಆಗಬೇಕು.");
            return;
        }

        const wb = XLSX.utils.book_new();

        function makeSheet(kind){
            const data = [];
            const isJama = kind === "jama";

            data.push([
                isJama ? "ಜಮಾ" : "ಖರ್ಚು",
                "O.B",
                ...items.map(i => i.item_name),
                "ಒಟ್ಟು"
            ]);

            lastReport.forEach(m => {
                const amount = isJama ? m.jama : m.kharchu;
                const opening = isJama ? m.opening : m.kharchuOpening;
                const closing = isJama ? m.jamaClosing : m.kharchuClosing;

                data.push([
                    m.label,
                    sumMap(opening),
                    ...items.map(i => num(amount[i.id])),
                    sumMap(amount)
                ]);

                data.push([
                    "",
                    "Closing",
                    ...items.map(i => num(closing[i.id])),
                    sumMap(closing)
                ]);
            });

            const first = lastReport[0];
            const last = lastReport[lastReport.length-1];

            data.push([
                "TOTAL",
                sumMap(first.opening),
                ...items.map(i =>
                    lastReport.reduce((s,m)=>s+num((isJama?m.jama:m.kharchu)[i.id]),0)
                ),
                lastReport.reduce((s,m)=>
                    s + sumMap(isJama?m.jama:m.kharchu),0)
            ]);

            const grandClosing = isJama ? last.jamaClosing : last.kharchuClosing;
            data.push([
                "GRAND TOTAL",
                sumMap(first.opening),
                ...items.map(i => num(grandClosing[i.id])),
                sumMap(grandClosing)
            ]);

            return XLSX.utils.aoa_to_sheet(data);
        }

        XLSX.utils.book_append_sheet(wb,makeSheet("jama"),"JAMA");
        XLSX.utils.book_append_sheet(wb,makeSheet("kharchu"),"KHARCHU");

        XLSX.writeFile(
            wb,
            `cash-book-report-${cashbookType}-${selectedYear}.xlsx`
        );
    }catch(error){
        console.error(error);
        alert("Excel export failed: " + error.message);
    }
}

async function init(){
    try{
        const {data:{session}} = await db.auth.getSession();

        if(!session){
            location.href = "login.html";
            return;
        }

        await loadSchool();
        await loadSettings();
        await loadAcademicYears();

        document.getElementById("cashbookType").addEventListener("change",async e => {
            cashbookType = e.target.value;
            updateHeader();
            await generateReport();
        });

        document.getElementById("academicYearSelect").addEventListener("change",async e => {
            selectedYearId = e.target.value;
            const row = academicYears.find(y => y.id === selectedYearId);
            selectedYear = row?.year_name || "";
            localStorage.setItem(
                "school_cashbook_year_" + currentSchoolId,
                selectedYearId
            );
            fillMonths();
            updateHeader();
            await generateReport();
        });

        await generateReport();
    }catch(error){
        console.error(error);
        alert(error.message);
    }
}

init();
</script>
