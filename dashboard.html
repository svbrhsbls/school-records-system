<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCHOOL RECORD SYSTEM — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Kannada","Nirmala UI",Arial,sans-serif;background:linear-gradient(135deg,#eef7f1,#f8fbff);color:#17221b}

.layout{display:flex;min-height:100vh}
.srs-fixed-menu{
 position:fixed!important;left:0!important;top:0!important;bottom:0!important;
 width:275px!important;z-index:2147483647!important;
 background:linear-gradient(180deg,#103b2a 0%,#176443 52%,#0b3022 100%)!important;
 color:#fff!important;padding:20px 15px!important;
 display:flex!important;flex-direction:column!important;
 box-shadow:8px 0 25px rgba(0,0,0,.22)!important;
 font-family:"Noto Sans Kannada","Nirmala UI",Arial,sans-serif!important;
}
.srs-fixed-menu .srs-title{
 text-align:center!important;font-size:20px!important;font-weight:900!important;
 padding:15px 5px 20px!important;border-bottom:1px solid rgba(255,255,255,.22)!important;
 color:#fff!important;
}
.srs-fixed-menu nav{margin-top:20px!important;display:flex!important;flex-direction:column!important;gap:9px!important}
.srs-fixed-menu nav a{
 display:flex!important;align-items:center!important;gap:12px!important;
 width:100%!important;padding:14px 15px!important;border-radius:12px!important;
 color:#fff!important;text-decoration:none!important;font-size:15px!important;
 font-weight:800!important;background:transparent!important;
}
.srs-fixed-menu nav a:hover{background:rgba(255,255,255,.13)!important}
.srs-fixed-menu nav a.srs-active{
 background:linear-gradient(90deg,#f4b83f,#ffd86e)!important;
 color:#173b2b!important;
 box-shadow:0 6px 15px rgba(0,0,0,.18)!important;
}
.srs-fixed-menu .srs-bottom{margin-top:auto!important;border-top:1px solid rgba(255,255,255,.22)!important;padding-top:15px!important}
.srs-fixed-menu button{
 width:100%!important;border:0!important;border-radius:12px!important;padding:13px!important;
 background:linear-gradient(90deg,#c0392b,#e74c3c)!important;color:#fff!important;
 font:800 15px "Noto Sans Kannada","Nirmala UI",Arial,sans-serif!important;cursor:pointer!important;
}
.srs-fixed-menu .srs-creator{text-align:center!important;color:#dceee4!important;font-size:11px!important;line-height:1.7!important;margin-top:12px!important}
.main{margin-left:275px!important;width:calc(100% - 275px)!important}
@media(max-width:900px){
 .srs-fixed-menu{width:225px!important}
 .main{margin-left:225px!important;width:calc(100% - 225px)!important}
}
@media(max-width:600px){
 .srs-fixed-menu{position:relative!important;width:100%!important;min-height:auto!important}
 .main{margin-left:0!important;width:100%!important}
}
@media print{
 .srs-fixed-menu{display:none!important}
 .main{margin-left:0!important;width:100%!important}
}
</style>
</head>
<body>
<div class="layout">

<aside class="srs-fixed-menu" aria-label="School Record System Menu">
  <div class="srs-title">SCHOOL RECORD SYSTEM</div>
  <nav>
    <a class="srs-active" href="dashboard.html">🏠 <span>Dashboard</span></a>
    <a href="school-cash-book.html">💰 <span>School Cash Book</span></a>
    <a href="report.html">📊 <span>Report</span></a>
    <a href="settings.html">⚙️ <span>Settings</span></a>
  </nav>
  <div class="srs-bottom">
    <button type="button" onclick="logout()">🚪 Logout</button>
    <div class="srs-creator">ರಚನೆ:- ಈರಪ್ಪ ಸಿ<br>Mobile No: 7259515753</div>
  </div>
</aside>

<main class="main">

    <section class="school">
        <div class="school-name" id="schoolName">ಶಾಲೆಯ ಹೆಸರು</div>
        <div class="year">
            Academic Year: <span id="academicYear">-</span>
        </div>
        <div class="today" id="todayDate">-</div>
    </section>

    <section class="cards">

        <div class="card">
            <div class="card-head">
                <div class="card-title">ಸರ್ಕಾರಿ Cash Book</div>
                <button class="refresh" onclick="refreshGovernment()">
                    ↻ Refresh
                </button>
            </div>

            <div class="balance-label">Closing Balance</div>
            <div class="balance" id="governmentBalance">
                <span class="loading">Loading...</span>
            </div>
            <div class="updated" id="governmentUpdated">
                Last Updated: -
            </div>
        </div>

        <div class="card">
            <div class="card-head">
                <div class="card-title">ಸರ್ಕಾರೇತ್ತರ Cash Book</div>
                <button class="refresh" onclick="refreshNonGovernment()">
                    ↻ Refresh
                </button>
            </div>

            <div class="balance-label">Closing Balance</div>
            <div class="balance" id="nonGovernmentBalance">
                <span class="loading">Loading...</span>
            </div>
            <div class="updated" id="nonGovernmentUpdated">
                Last Updated: -
            </div>
        </div>

    </section>
</main>
</div>

<script>
const SUPABASE_URL =
    "https://xhskrohrrsxlfbdbhyji.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_0amt5yG7ZIm6JD7oub6JTw_Hv5Nx2cl";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentSchoolId = null;
let activeYear = null;

function money(n){
    return "₹" + Number(n || 0).toLocaleString("en-IN",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    });
}

function setToday(){
    const days = [
        "ಭಾನುವಾರ",
        "ಸೋಮವಾರ",
        "ಮಂಗಳವಾರ",
        "ಬುಧವಾರ",
        "ಗುರುವಾರ",
        "ಶುಕ್ರವಾರ",
        "ಶನಿವಾರ"
    ];

    const d = new Date();
    const dd = String(d.getDate()).padStart(2,"0");
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const yyyy = d.getFullYear();

    document.getElementById("todayDate").textContent =
        `${dd}-${mm}-${yyyy} ${days[d.getDay()]}`;
}

async function getSchool(){
    const {data:{user},error:userError} =
        await db.auth.getUser();

    if(userError) throw userError;
    if(!user){
        location.href = "login.html";
        return false;
    }

    const {data,error} = await db
        .from("school_users")
        .select("school_id")
        .eq("user_id",user.id)
        .eq("is_active",true)
        .maybeSingle();

    if(error) throw error;
    if(!data) throw new Error("Login userಗೆ School mapping ಇಲ್ಲ.");

    currentSchoolId = data.school_id;
    return true;
}

async function loadSchoolDetails(){
    const {data,error} = await db
        .from("school_cashbook_settings")
        .select("school_name")
        .eq("school_id",currentSchoolId)
        .maybeSingle();

    if(error) throw error;

    document.getElementById("schoolName").textContent =
        data?.school_name || "ಶಾಲೆಯ ಹೆಸರು";
}

async function loadActiveYear(){
    const {data,error} = await db
        .from("school_cashbook_academic_years")
        .select("id,year_name,start_date,end_date,is_active")
        .eq("school_id",currentSchoolId)
        .eq("is_active",true)
        .maybeSingle();

    if(error) throw error;

    activeYear = data || null;

    document.getElementById("academicYear").textContent =
        activeYear?.year_name || "-";
}

async function loadClosing(type,balanceId,updatedId){
    const balanceEl = document.getElementById(balanceId);
    const updatedEl = document.getElementById(updatedId);

    balanceEl.innerHTML = '<span class="loading">Loading...</span>';

    if(!activeYear){
        balanceEl.textContent = "₹0.00";
        updatedEl.textContent = "Last Updated: -";
        return;
    }

    const {data:openingRows,error:openingError} = await db
        .from("school_cashbook_opening_balances")
        .select("item_id,opening_balance,updated_at")
        .eq("school_id",currentSchoolId)
        .eq("academic_year_id",activeYear.id)
        .eq("cashbook_type",type);

    if(openingError) throw openingError;

    const opening = {};
    let latest = null;

    (openingRows || []).forEach(r => {
        opening[r.item_id] = Number(r.opening_balance || 0);
        if(r.updated_at && (!latest || r.updated_at > latest))
            latest = r.updated_at;
    });

    const {data:entryRows,error:entryError} = await db
        .from("school_cashbook_entries")
        .select("entry_type,item_id,amount,created_at")
        .eq("school_id",currentSchoolId)
        .eq("academic_year_id",activeYear.id)
        .eq("cashbook_type",type);

    if(entryError) throw entryError;

    let closing = 0;

    Object.values(opening).forEach(v => closing += Number(v || 0));

    (entryRows || []).forEach(e => {
        const amount = Number(e.amount || 0);

        if(e.entry_type === "jama")
            closing += amount;
        else if(e.entry_type === "kharchu")
            closing -= amount;

        if(e.created_at && (!latest || e.created_at > latest))
            latest = e.created_at;
    });

    balanceEl.textContent = money(closing);

    updatedEl.textContent =
        "Last Updated: " +
        (latest ? formatDateTime(latest) : "ಇನ್ನೂ Entry ಇಲ್ಲ");
}

function formatDateTime(value){
    const d = new Date(value);

    if(Number.isNaN(d.getTime()))
        return value;

    const dd = String(d.getDate()).padStart(2,"0");
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const yyyy = d.getFullYear();

    const hh = String(d.getHours()).padStart(2,"0");
    const min = String(d.getMinutes()).padStart(2,"0");

    return `${dd}-${mm}-${yyyy} ${hh}:${min}`;
}

async function refreshGovernment(){
    try{
        await loadActiveYear();
        await loadClosing(
            "ಸರ್ಕಾರಿ",
            "governmentBalance",
            "governmentUpdated"
        );
    }catch(error){
        console.error(error);
        document.getElementById("governmentBalance").innerHTML =
            '<span class="error">Load failed</span>';
        document.getElementById("governmentUpdated").textContent =
            "Last Updated: -";
    }
}

async function refreshNonGovernment(){
    try{
        await loadActiveYear();
        await loadClosing(
            "ಸರ್ಕಾರೇತ್ತರ",
            "nonGovernmentBalance",
            "nonGovernmentUpdated"
        );
    }catch(error){
        console.error(error);
        document.getElementById("nonGovernmentBalance").innerHTML =
            '<span class="error">Load failed</span>';
        document.getElementById("nonGovernmentUpdated").textContent =
            "Last Updated: -";
    }
}

async function logout(){
    await db.auth.signOut();
    location.href = "login.html";
}

async function init(){
    try{
        setToday();

        const ok = await getSchool();
        if(!ok) return;

        await loadSchoolDetails();
        await loadActiveYear();

        await Promise.all([
            loadClosing(
                "ಸರ್ಕಾರಿ",
                "governmentBalance",
                "governmentUpdated"
            ),
            loadClosing(
                "ಸರ್ಕಾರೇತ್ತರ",
                "nonGovernmentBalance",
                "nonGovernmentUpdated"
            )
        ]);
    }catch(error){
        console.error(error);
        alert("Dashboard load failed: " + error.message);
    }
}

init();
</script>
</body>
</html>
