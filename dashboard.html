<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCHOOL RECORD SYSTEM — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Kannada","Nirmala UI",Arial,sans-serif;background:linear-gradient(135deg,#eef7f1,#f8fbff);color:#17221b}
.layout{display:flex;min-height:100vh}
.sidebar{width:265px;background:linear-gradient(180deg,#102f24 0%,#176044 52%,#0d3b2e 100%);color:#fff;padding:18px 14px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:10;box-shadow:5px 0 22px #123c2d30}
.brand{font-size:20px;font-weight:900;text-align:center;padding:14px 8px 20px;border-bottom:1px solid #ffffff30;letter-spacing:.4px;text-shadow:0 2px 8px #0004}
.menu{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.menu a,.logout{display:flex;align-items:center;gap:11px;color:#fff;text-decoration:none;padding:13px 14px;border-radius:12px;font-size:14px;font-weight:800;transition:.2s;position:relative}
.menu a:nth-child(1)::before{content:"🏠"}.menu a:nth-child(2)::before{content:"💰"}.menu a:nth-child(3)::before{content:"📊"}.menu a:nth-child(4)::before{content:"⚙️"}
.menu a::before{font-size:17px}.menu a:hover{background:#ffffff18;transform:translateX(3px)}.menu a.active{background:linear-gradient(90deg,#35b779,#269d68);box-shadow:0 5px 15px #0003}
.bottom{margin-top:auto;border-top:1px solid #ffffff30;padding-top:14px}.logout{width:100%;border:0;background:#c0392b;color:#fff;text-align:left;cursor:pointer;font-family:inherit;justify-content:flex-start}.logout:hover{background:#e04b3b;transform:translateY(-1px)}
.creator{margin-top:12px;font-size:12px;line-height:1.7;color:#dce9e1;text-align:center}
.main{margin-left:265px;width:calc(100% - 265px);padding:25px}
.school{position:relative;background:linear-gradient(135deg,#ffffff,#effaf4);border:1px solid #cfe4d7;border-radius:18px;padding:28px 28px 25px;text-align:left;box-shadow:0 8px 25px #164e3212;min-height:145px}
.school-name{font-size:30px;font-weight:900;color:#176044;line-height:1.3;padding-right:290px}.year{margin-top:9px;font-size:20px;font-weight:900;color:#2459a6}.year span{display:inline-block;background:#e6f0ff;color:#174b9b;border-radius:10px;padding:5px 12px}.today{position:absolute;right:22px;bottom:22px;background:linear-gradient(135deg,#fff4cf,#ffe3a0);color:#8a4d00;border:1px solid #f0c96b;border-radius:12px;padding:11px 16px;font-size:17px;font-weight:900;box-shadow:0 4px 12px #8a5a0015;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:20px;margin-top:22px}
.card{background:#fff;border:1px solid #d6e7dc;border-radius:18px;padding:22px;box-shadow:0 8px 25px #164e3210;position:relative;overflow:hidden}.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,#20a56b,#176044)}.card:nth-child(2)::before{background:linear-gradient(180deg,#3478df,#7048b8)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.card-title{font-size:20px;font-weight:900;color:#176044}.card:nth-child(2) .card-title{color:#5540a0}
.refresh{border:0;border-radius:10px;padding:9px 13px;background:#e5f7ed;color:#12613f;font-weight:900;cursor:pointer;transition:.2s}.refresh:hover{background:#ccefdc;transform:translateY(-1px)}.card:nth-child(2) .refresh{background:#eeeaff;color:#56419b}.card:nth-child(2) .refresh:hover{background:#ded7ff}
.balance-label{margin-top:25px;font-size:14px;font-weight:800;color:#65746b}.balance{margin-top:5px;font-size:34px;font-weight:900;color:#14915c}.card:nth-child(2) .balance{color:#654bc0}.updated{margin-top:13px;font-size:12px;color:#65746b}.loading{font-size:14px;color:#65746b}.error{color:#a33b32;font-size:13px}
@media(max-width:900px){.sidebar{width:220px}.main{margin-left:220px;width:calc(100% - 220px);padding:16px}.cards{grid-template-columns:1fr}.school-name{padding-right:0}.today{position:static;display:inline-block;margin-top:14px}}
@media(max-width:600px){.sidebar{position:static;width:100%;min-height:auto}.layout{display:block}.main{margin-left:0;width:100%;padding:12px}.brand{font-size:18px}.school{padding:20px}.school-name{font-size:23px}.today{font-size:15px}.year{font-size:17px}}

/* ===== RIGHT PAGE VIEW ONLY ===== */
#srsPageFrame{
  display:none;
  position:fixed;
  left:265px;
  top:0;
  width:calc(100vw - 265px);
  height:100vh;
  border:0;
  margin:0;
  padding:0;
  background:#fff;
  z-index:50;
}
@media(max-width:900px){
  #srsPageFrame{left:220px;width:calc(100vw - 220px)}
}
@media(max-width:600px){
  #srsPageFrame{left:0;width:100vw}
}
@media print{
  #srsPageFrame{display:none!important}
}

</style>
</head>
<body>
<div class="layout">

<aside class="sidebar">
    <div class="brand">SCHOOL RECORD SYSTEM</div>

    <nav class="menu">
        <a class="active" href="dashboard.html">Dashboard</a>
        <a href="school-cash-book.html">School Cash Book</a>
        <a href="report.html">Report</a>
        <a href="settings.html">Settings</a>
    </nav>

    <div class="bottom">
        <button class="logout" onclick="logout()">Logout</button>
        <div class="creator">
            ರಚನೆ:- ಈರಪ್ಪ ಸಿ<br>
            Mobile No: 7259515753
        </div>
    </div>
</aside>

<main class="main">

    <section class="school">
        <div class="school-name" id="schoolName">ಶಾಲೆಯ ಹೆಸರು</div>
        <div class="year">
            Academic Year: <span id="academicYear">-</span>
        </div>
        <div class="today" id="todayDate">-</div>
    </section>

    <section class="cards">

        <div class="card">
            <div class="card-head">
                <div class="card-title">ಸರ್ಕಾರಿ Cash Book</div>
                <button class="refresh" onclick="refreshGovernment()">
                    ↻ Refresh
                </button>
            </div>

            <div class="balance-label">Closing Balance</div>
            <div class="balance" id="governmentBalance">
                <span class="loading">Loading...</span>
            </div>
            <div class="updated" id="governmentUpdated">
                Last Updated: -
            </div>
        </div>

        <div class="card">
            <div class="card-head">
                <div class="card-title">ಸರ್ಕಾರೇತ್ತರ Cash Book</div>
                <button class="refresh" onclick="refreshNonGovernment()">
                    ↻ Refresh
                </button>
            </div>

            <div class="balance-label">Closing Balance</div>
            <div class="balance" id="nonGovernmentBalance">
                <span class="loading">Loading...</span>
            </div>
            <div class="updated" id="nonGovernmentUpdated">
                Last Updated: -
            </div>
        </div>

    </section>
</main>
</div>

<script>
const SUPABASE_URL =
    "https://xhskrohrrsxlfbdbhyji.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_0amt5yG7ZIm6JD7oub6JTw_Hv5Nx2cl";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentSchoolId = null;
let activeYear = null;

function money(n){
    return "₹" + Number(n || 0).toLocaleString("en-IN",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    });
}

function setToday(){
    const days = [
        "ಭಾನುವಾರ",
        "ಸೋಮವಾರ",
        "ಮಂಗಳವಾರ",
        "ಬುಧವಾರ",
        "ಗುರುವಾರ",
        "ಶುಕ್ರವಾರ",
        "ಶನಿವಾರ"
    ];

    const d = new Date();
    const dd = String(d.getDate()).padStart(2,"0");
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const yyyy = d.getFullYear();

    document.getElementById("todayDate").textContent =
        `${dd}-${mm}-${yyyy} ${days[d.getDay()]}`;
}

async function getSchool(){
    const {data:{user},error:userError} =
        await db.auth.getUser();

    if(userError) throw userError;
    if(!user){
        location.href = "login.html";
        return false;
    }

    const {data,error} = await db
        .from("school_users")
        .select("school_id")
        .eq("user_id",user.id)
        .eq("is_active",true)
        .maybeSingle();

    if(error) throw error;
    if(!data) throw new Error("Login userಗೆ School mapping ಇಲ್ಲ.");

    currentSchoolId = data.school_id;
    return true;
}

async function loadSchoolDetails(){
    const {data,error} = await db
        .from("school_cashbook_settings")
        .select("school_name")
        .eq("school_id",currentSchoolId)
        .maybeSingle();

    if(error) throw error;

    document.getElementById("schoolName").textContent =
        data?.school_name || "ಶಾಲೆಯ ಹೆಸರು";
}

async function loadActiveYear(){
    const {data,error} = await db
        .from("school_cashbook_academic_years")
        .select("id,year_name,start_date,end_date,is_active")
        .eq("school_id",currentSchoolId)
        .eq("is_active",true)
        .maybeSingle();

    if(error) throw error;

    activeYear = data || null;

    document.getElementById("academicYear").textContent =
        activeYear?.year_name || "-";
}

async function loadClosing(type,balanceId,updatedId){
    const balanceEl = document.getElementById(balanceId);
    const updatedEl = document.getElementById(updatedId);

    balanceEl.innerHTML = '<span class="loading">Loading...</span>';

    if(!activeYear){
        balanceEl.textContent = "₹0.00";
        updatedEl.textContent = "Last Updated: -";
        return;
    }

    const {data:openingRows,error:openingError} = await db
        .from("school_cashbook_opening_balances")
        .select("item_id,opening_balance,updated_at")
        .eq("school_id",currentSchoolId)
        .eq("academic_year_id",activeYear.id)
        .eq("cashbook_type",type);

    if(openingError) throw openingError;

    const opening = {};
    let latest = null;

    (openingRows || []).forEach(r => {
        opening[r.item_id] = Number(r.opening_balance || 0);
        if(r.updated_at && (!latest || r.updated_at > latest))
            latest = r.updated_at;
    });

    const {data:entryRows,error:entryError} = await db
        .from("school_cashbook_entries")
        .select("entry_type,item_id,amount,created_at")
        .eq("school_id",currentSchoolId)
        .eq("academic_year_id",activeYear.id)
        .eq("cashbook_type",type);

    if(entryError) throw entryError;

    let closing = 0;

    Object.values(opening).forEach(v => closing += Number(v || 0));

    (entryRows || []).forEach(e => {
        const amount = Number(e.amount || 0);

        if(e.entry_type === "jama")
            closing += amount;
        else if(e.entry_type === "kharchu")
            closing -= amount;

        if(e.created_at && (!latest || e.created_at > latest))
            latest = e.created_at;
    });

    balanceEl.textContent = money(closing);

    updatedEl.textContent =
        "Last Updated: " +
        (latest ? formatDateTime(latest) : "ಇನ್ನೂ Entry ಇಲ್ಲ");
}

function formatDateTime(value){
    const d = new Date(value);

    if(Number.isNaN(d.getTime()))
        return value;

    const dd = String(d.getDate()).padStart(2,"0");
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const yyyy = d.getFullYear();

    const hh = String(d.getHours()).padStart(2,"0");
    const min = String(d.getMinutes()).padStart(2,"0");

    return `${dd}-${mm}-${yyyy} ${hh}:${min}`;
}

async function refreshGovernment(){
    try{
        await loadActiveYear();
        await loadClosing(
            "ಸರ್ಕಾರಿ",
            "governmentBalance",
            "governmentUpdated"
        );
    }catch(error){
        console.error(error);
        document.getElementById("governmentBalance").innerHTML =
            '<span class="error">Load failed</span>';
        document.getElementById("governmentUpdated").textContent =
            "Last Updated: -";
    }
}

async function refreshNonGovernment(){
    try{
        await loadActiveYear();
        await loadClosing(
            "ಸರ್ಕಾರೇತ್ತರ",
            "nonGovernmentBalance",
            "nonGovernmentUpdated"
        );
    }catch(error){
        console.error(error);
        document.getElementById("nonGovernmentBalance").innerHTML =
            '<span class="error">Load failed</span>';
        document.getElementById("nonGovernmentUpdated").textContent =
            "Last Updated: -";
    }
}

async function logout(){
    await db.auth.signOut();
    location.href = "login.html";
}

async function init(){
    try{
        setToday();

        const ok = await getSchool();
        if(!ok) return;

        await loadSchoolDetails();
        await loadActiveYear();

        await Promise.all([
            loadClosing(
                "ಸರ್ಕಾರಿ",
                "governmentBalance",
                "governmentUpdated"
            ),
            loadClosing(
                "ಸರ್ಕಾರೇತ್ತರ",
                "nonGovernmentBalance",
                "nonGovernmentUpdated"
            )
        ]);
    }catch(error){
        console.error(error);
        alert("Dashboard load failed: " + error.message);
    }
}

init();
</script>
<iframe id="srsPageFrame" title="School Record System Page"></iframe>

<script>
(function(){
  const frame = document.getElementById("srsPageFrame");
  const main = document.querySelector(".main");
  const links = document.querySelectorAll(".menu a");

  function showDashboard(){
    frame.style.display = "none";
    frame.removeAttribute("src");
    main.style.display = "";
  }

  function showPage(url){
    main.style.display = "none";
    frame.style.display = "block";
    frame.src = url;
  }

  links.forEach(link=>{
    link.addEventListener("click", function(e){
      const url = this.getAttribute("href");
      if(!url) return;

      e.preventDefault();
      links.forEach(a=>a.classList.remove("active"));
      this.classList.add("active");

      if(url === "dashboard.html"){
        showDashboard();
      }else{
        showPage(url);
      }
    });
  });
})();
</script>

</body>
</html>
