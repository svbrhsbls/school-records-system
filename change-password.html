<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password ಬದಲಾಯಿಸಿ - School Result Management System</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Noto Sans Kannada", "Nirmala UI", Arial, sans-serif;
            background: linear-gradient(135deg, #17365d, #2e75b6);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: #fff;
            border-radius: 18px;
            padding: 35px 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            text-align: center;
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #17365d;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            color: #17365d;
            font-size: 24px;
            line-height: 1.5;
        }

        .system-title {
            margin-top: 8px;
            color: #555;
            font-size: 16px;
        }

        .page-title {
            margin-top: 28px;
            margin-bottom: 20px;
            color: #17365d;
            font-size: 21px;
            font-weight: 700;
        }

        .form-group {
            text-align: left;
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .password-box {
            position: relative;
        }

        input {
            width: 100%;
            padding: 13px 48px 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2e75b6;
            box-shadow: 0 0 0 3px rgba(46,117,182,0.12);
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 19px;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .show-password:hover {
            background: #f1f5f9;
            border-radius: 50%;
        }

        .change-button {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #17365d;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .change-button:hover {
            background: #0f2947;
        }

        .change-button:disabled {
            background: #8a9aaa;
            cursor: not-allowed;
        }

        .back-button {
            width: 100%;
            margin-top: 10px;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #fff;
            color: #17365d;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .back-button:hover {
            background: #f8fafc;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .footer {
            margin-top: 22px;
            color: #777;
            font-size: 12px;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 20px;
            }

            h1 {
                font-size: 20px;
            }

            .system-title {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <div class="icon">🔐</div>

        <h1>ಶ್ರೀ ವೀರಬಲ್ಲಾಳ ಗ್ರಾಮಾಂತರ ಪ್ರೌಢಶಾಲೆ</h1>

        <div class="system-title">
            ಬಲ್ಲಾಳಸಮುದ್ರ, ಹೊಸದುರ್ಗ ತಾಲ್ಲೂಕು
        </div>

        <div class="page-title">
            Password ಬದಲಾಯಿಸಿ
        </div>

        <form id="changePasswordForm">

            <div class="form-group">
                <label for="diseCode">ಶಾಲೆಯ DISE Code Number</label>
                <input
                    type="text"
                    id="diseCode"
                    placeholder="ಶಾಲೆಯ DISE Code Number ನಮೂದಿಸಿ"
                    inputmode="numeric"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="currentPassword">ಪ್ರಸ್ತುತ Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="currentPassword"
                        placeholder="ಪ್ರಸ್ತುತ Password ನಮೂದಿಸಿ"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        data-target="currentPassword"
                        title="Password ತೋರಿಸಿ"
                        aria-label="Password ತೋರಿಸಿ"
                    >👁️</button>
                </div>
            </div>

            <div class="form-group">
                <label for="newPassword">ಹೊಸ Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="newPassword"
                        placeholder="ಹೊಸ Password ನಮೂದಿಸಿ"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        data-target="newPassword"
                        title="Password ತೋರಿಸಿ"
                        aria-label="Password ತೋರಿಸಿ"
                    >👁️</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">ಹೊಸ Password ಮತ್ತೆ ನಮೂದಿಸಿ</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="ಹೊಸ Password ಮತ್ತೆ ನಮೂದಿಸಿ"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        data-target="confirmPassword"
                        title="Password ತೋರಿಸಿ"
                        aria-label="Password ತೋರಿಸಿ"
                    >👁️</button>
                </div>
            </div>

            <button
                type="submit"
                class="change-button"
                id="changeButton"
            >
                Password ಬದಲಾಯಿಸಿ
            </button>

            <button
                type="button"
                class="back-button"
                onclick="window.location.href='dashboard.html'"
            >
                Dashboardಗೆ ಹಿಂತಿರುಗಿ
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="footer">
            © School Result Management System
        </div>

    </div>
</div>

<script>
    /* =====================================================
       SUPABASE CONFIGURATION
       ===================================================== */

    const SUPABASE_URL =
        "https://xhskrohrrsxlfbdbhyji.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_0amt5yG7ZIm6JD7oub6JTw_Hv5Nx2cl";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const form =
        document.getElementById("changePasswordForm");

    const diseCode =
        document.getElementById("diseCode");

    const currentPassword =
        document.getElementById("currentPassword");

    const newPassword =
        document.getElementById("newPassword");

    const confirmPassword =
        document.getElementById("confirmPassword");

    const changeButton =
        document.getElementById("changeButton");

    const message =
        document.getElementById("message");


    /* =====================================================
       SHOW / HIDE PASSWORD
       ===================================================== */

    document.querySelectorAll(".show-password").forEach(
        function(button) {

            button.addEventListener("click", function() {

                const targetId =
                    button.getAttribute("data-target");

                const input =
                    document.getElementById(targetId);

                if (input.type === "password") {

                    input.type = "text";

                    button.textContent = "🙈";
                    button.title = "Password ಮರೆಮಾಡಿ";
                    button.setAttribute(
                        "aria-label",
                        "Password ಮರೆಮಾಡಿ"
                    );

                } else {

                    input.type = "password";

                    button.textContent = "👁️";
                    button.title = "Password ತೋರಿಸಿ";
                    button.setAttribute(
                        "aria-label",
                        "Password ತೋರಿಸಿ"
                    );
                }
            });
        }
    );


    /* =====================================================
       MESSAGE
       ===================================================== */

    function showMessage(text, type) {

        message.textContent = text;
        message.className = "message " + type;
    }


    /* =====================================================
       CHANGE PASSWORD
       ===================================================== */

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const current =
                currentPassword.value;

            const newPass =
                newPassword.value;

            const confirm =
                confirmPassword.value;


            if (!current) {

                showMessage(
                    "ದಯವಿಟ್ಟು ಪ್ರಸ್ತುತ Password ನಮೂದಿಸಿ.",
                    "error"
                );

                currentPassword.focus();
                return;
            }


            if (!newPass) {

                showMessage(
                    "ದಯವಿಟ್ಟು ಹೊಸ Password ನಮೂದಿಸಿ.",
                    "error"
                );

                newPassword.focus();
                return;
            }


            if (newPass.length < 6) {

                showMessage(
                    "ಹೊಸ Password ಕನಿಷ್ಠ 6 ಅಕ್ಷರಗಳಿರಬೇಕು.",
                    "error"
                );

                newPassword.focus();
                return;
            }


            if (newPass !== confirm) {

                showMessage(
                    "ಹೊಸ Password ಎರಡೂ ಒಂದೇ ಆಗಿರಬೇಕು.",
                    "error"
                );

                confirmPassword.focus();
                return;
            }


            if (current === newPass) {

                showMessage(
                    "ಹೊಸ Password, ಪ್ರಸ್ತುತ Passwordಗಿಂತ ಬೇರೆಯಾಗಿರಬೇಕು.",
                    "error"
                );

                newPassword.focus();
                return;
            }


            changeButton.disabled = true;
            changeButton.textContent =
                "Password ಬದಲಾಯಿಸಲಾಗುತ್ತಿದೆ...";

            showMessage(
                "ದಯವಿಟ್ಟು ಕಾಯಿರಿ...",
                "success"
            );


            try {

                /* Find the Auth email using the school's DISE code */
                const {
                    data: loginEmail,
                    error: lookupError
                } = await supabaseClient.rpc(
                    "get_login_email_by_dise",
                    {
                        p_dise_code: diseCode.value.trim()
                    }
                );

                if (lookupError || !loginEmail) {

                    showMessage(
                        "ಈ DISE Codeಗೆ ಸಂಬಂಧಿಸಿದ ಶಾಲೆ ಸಿಗಲಿಲ್ಲ.",
                        "error"
                    );

                    changeButton.disabled = false;
                    changeButton.textContent =
                        "Password ಬದಲಾಯಿಸಿ";

                    diseCode.focus();
                    return;
                }

                /* Verify current password and create a session */
                const {
                    error: verifyError
                } =
                    await supabaseClient.auth.signInWithPassword({
                        email: loginEmail,
                        password: current
                    });

                if (verifyError) {

                    showMessage(
                        "ಪ್ರಸ್ತುತ Password ತಪ್ಪಾಗಿದೆ.",
                        "error"
                    );

                    changeButton.disabled = false;
                    changeButton.textContent =
                        "Password ಬದಲಾಯಿಸಿ";

                    currentPassword.focus();
                    return;
                }

                /* Update password */
                const {
                    error: updateError
                } =
                    await supabaseClient.auth.updateUser({
                        password: newPass
                    });

                if (updateError) {

                    console.error(
                        "Password update error:",
                        updateError
                    );

                    showMessage(
                        "Password ಬದಲಾಯಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ. ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.",
                        "error"
                    );

                    changeButton.disabled = false;
                    changeButton.textContent =
                        "Password ಬದಲಾಯಿಸಿ";

                    return;
                }

                showMessage(
                    "Password ಯಶಸ್ವಿಯಾಗಿ ಬದಲಾಯಿಸಲಾಗಿದೆ.",
                    "success"
                );

                form.reset();

                changeButton.disabled = false;
                changeButton.textContent =
                    "Password ಬದಲಾಯಿಸಿ";

                        } catch (error) {

                console.error(
                    "Password change error:",
                    error
                );

                showMessage(
                    error.message ||
                    "Password ಬದಲಾಯಿಸುವಾಗ ದೋಷ ಸಂಭವಿಸಿದೆ.",
                    "error"
                );

                changeButton.disabled = false;
                changeButton.textContent =
                    "Password ಬದಲಾಯಿಸಿ";
            }

        }
    );


</script>

</body>
</html>
