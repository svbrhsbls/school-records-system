<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Records System - Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Noto Sans Kannada", sans-serif;
            background: linear-gradient(135deg, #eef4ff, #dce8ff);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background: #ffffff;
            border-radius: 18px;
            padding: 35px 30px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #1d4ed8;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin: 5px 0;
            color: #1e293b;
            font-size: 25px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
            font-size: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            border: none;
            border-radius: 9px;
            padding: 14px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 13px;
        }
    
        .password-wrap{
            position:relative;
            margin-bottom:18px;
        }
        .password-wrap input{
            margin-bottom:0;
            padding-right:48px;
        }
        .password-toggle{
            position:absolute;
            right:10px;
            top:50%;
            transform:translateY(-50%);
            width:34px;
            height:34px;
            padding:0;
            border:0;
            background:transparent;
            color:#64748b;
            font-size:19px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .password-toggle:hover{
            background:transparent;
            color:#2563eb;
        }

    </style>
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="logo">SR</div>

        <h1>School Records System</h1>

        <div class="subtitle">
            ಶಾಲಾ ದಾಖಲೆ ನಿರ್ವಹಣಾ ವ್ಯವಸ್ಥೆ
        </div>

        <form id="loginForm">

            <label for="email">ಶಾಲೆಯ DISE Code Number</label>

            <input
                type="text"
                id="email"
                placeholder="Email ನಮೂದಿಸಿ"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>

            <div class="password-wrap">
                <input
                    type="password"
                    id="password"
                    placeholder="Password ನಮೂದಿಸಿ"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    id="passwordToggle"
                    aria-label="Password ತೋರಿಸಿ"
                    title="Password ತೋರಿಸಿ"
                >👁️</button>
            </div>

            <button type="submit" id="loginBtn">
                Login
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="footer">
            School Records System
        </div>

    </div>

</div>


<script>

    /* =====================================================
       SUPABASE CONFIGURATION
       ===================================================== */

    const SUPABASE_URL = "https://xhskrohrrsxlfbdbhyji.supabase.co";

    const SUPABASE_KEY = "sb_publishable_0amt5yG7ZIm6JD7oub6JTw_Hv5Nx2cl";

   


    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    /* =====================================================
       MESSAGE
       ===================================================== */

    function showMessage(text, type) {

        const message = document.getElementById("message");

        message.textContent = text;

        message.className = "message " + type;

        message.style.display = "block";
    }


    /* =====================================================
       LOGIN
       ===================================================== */

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();

            const loginBtn = document.getElementById("loginBtn");

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            if (!email || !password) {

                showMessage(
                    "DISE Code Number ಮತ್ತು Password ನಮೂದಿಸಿ.",
                    "error"
                );

                return;
            }


            loginBtn.disabled = true;

            loginBtn.textContent = "Login ಆಗುತ್ತಿದೆ...";


            try {

                const { data: loginData, error: lookupError } =
                    await supabaseClient.rpc("get_login_email_by_dise", {
                        p_dise_code: email
                    });

                if (lookupError) {
                    throw lookupError;
                }

                const loginEmail =
                    typeof loginData === "string"
                        ? loginData
                        : loginData?.email;

                if (!loginEmail) {
                    throw new Error("ಈ DISE Code Numberಗೆ ಶಾಲೆಯ login ಕಂಡುಬಂದಿಲ್ಲ.");
                }

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: loginEmail,
                        password: password
                    });


                if (error) {

                    throw error;

                }


                if (!data || !data.user) {

                    throw new Error(
                        "Login failed."
                    );

                }


                showMessage(
                    "Login ಯಶಸ್ವಿಯಾಗಿದೆ.",
                    "success"
                );


                setTimeout(function () {

                    window.location.href = "dashboard.html";

                }, 700);


            } catch (error) {

                console.error(error);

                showMessage(
                    error.message || "Login ವಿಫಲವಾಗಿದೆ.",
                    "error"
                );

            } finally {

                loginBtn.disabled = false;

                loginBtn.textContent = "Login";

            }

        });



    const passwordToggle = document.getElementById("passwordToggle");
    const passwordInput = document.getElementById("password");

    passwordToggle.addEventListener("click", function () {
        const showing = passwordInput.type === "text";
        passwordInput.type = showing ? "password" : "text";
        this.textContent = showing ? "👁️" : "🙈";
        this.setAttribute(
            "aria-label",
            showing ? "Password ತೋರಿಸಿ" : "Password ಮರೆಮಾಡಿ"
        );
        this.setAttribute(
            "title",
            showing ? "Password ತೋರಿಸಿ" : "Password ಮರೆಮಾಡಿ"
        );
    });

    /* =====================================================
       ALREADY LOGGED IN
       ===================================================== */

    async function checkExistingSession() {

        try {

            const { data } =
                await supabaseClient.auth.getSession();

            if (data && data.session) {

                window.location.href = "dashboard.html";

            }

        } catch (error) {

            console.error(error);

        }

    }


    checkExistingSession();

</script>

</body>
</html>
